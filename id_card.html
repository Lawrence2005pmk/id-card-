<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID Card - Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #e9eef3; }

    .id-card {
      width: 340px;
      max-width: 100%;
      border: 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
    }

    .id-header {
      background: #1b4965;
      color: #fff;
      padding: 1.25rem 1rem 4.5rem;
    }

    .id-photo {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: cover;
      border: 4px solid #fff;
      margin: -55px auto 0;
      position: relative;
      z-index: 1;
      background: #cfd8e0;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
    }

    .id-label { font-size: .75rem; color: #6c757d; margin-bottom: 0; }
    .id-value { font-weight: 600; margin-bottom: .75rem; }
  </style>
</head>
<body>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card id-card">

      <div class="id-header text-center">
        <h5 class="mb-0">SLA Institute</h5>
        <small>Student Identity Card</small>
      </div>

      <img class="id-photo rounded-circle"
           src="https://i.pinimg.com/474x/95/86/46/9586467cebbe148b912bfb4085006cfc.jpg" alt="E Arockia Lawrence">

      <div class="card-body text-center pt-3">
        <h4 class="card-title mb-0">E Arockia Lawrence</h4>
        <p class="text-muted mb-3">Software developer</p>

        <hr class="mt-0">

        <div class="row text-start px-2">
          <div class="col-6">
            <p class="id-label">ID No.</p>
            <p class="id-value">8374</p>
          </div>
          <div class="col-6">
            <p class="id-label">Department</p>
            <p class="id-value">Python fullstack</p>
          </div>
          <div class="col-6">
            <p class="id-label">Blood group</p>
            <p class="id-value">O+</p>
          </div>
          <div class="col-6">
            <p class="id-label">Phone</p>
            <p class="id-value">+91 98765 *****</p>
          </div>
        </div>
      </div>

      <div class="card-footer text-center small bg-light">
        Valid until 31 Dec 2027
      </div>
    </div>
  </div>

</body>
</html>
